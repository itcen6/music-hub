name: Hanwool Java CI with Maven & CodeDeploy

on:
  push:
    branches: [ "develop-hanwool" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Multi-Arch Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.HANWOOL_REGISTRY_HOST }}/music-hub:latest \
            --push .

      - name: Upload docker-compose file
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.HANWOOL_SSH_HOST }}
          username: ${{ secrets.HANWOOL_SSH_USERNAME }}
          password: ${{ secrets.HANWOOL_SSH_PASSWORD }}
          port: ${{ secrets.HANWOOL_SSH_PORT_NUMBER }}
          source: "docker-compose-back.yaml"
          target: ${{ secrets.HANWOOL_WORK_DIR }}

      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HANWOOL_SSH_HOST }}
          username: ${{ secrets.HANWOOL_SSH_USERNAME }}
          password: ${{ secrets.HANWOOL_SSH_PASSWORD }}
          port: ${{ secrets.HANWOOL_SSH_PORT_NUMBER }}
          script: |
            cd ${{ secrets.HANWOOL_WORK_DIR }}
            docker compose -f docker-compose-back.yaml down || true
            docker rmi -f ${{ secrets.HANWOOL_REGISTRY_HOST }}/music-hub:latest || true
            docker pull ${{ secrets.HANWOOL_REGISTRY_HOST }}/music-hub:latest
            docker compose -f docker-compose-back.yaml up -d